# `release` — build distributable packages for macOS, Linux, and Windows.
#
# Triggers on a version tag push (`v*`) or manual dispatch. Each job builds the release
# binary and runs the SAME packaging script used locally (app/scripts/package.sh /
# package.ps1), then uploads the result as a workflow ARTIFACT (downloadable from the run
# page). It does NOT create or attach a GitHub Release — the builds are UNSIGNED dev builds
# and must not be published as releases until signing/notarization + the pre-distribution
# security audit are done (see app/PACKAGING.md, projects/pre-distribution-security-audit.md).
#
# macOS, Linux, AND Windows are all REQUIRED — every target compiles and packages today, so a
# packaging failure on any of them gates the release. Linux fans out to native x64 AND arm64
# builds (a runner per architecture). (app/PACKAGING.md).
#
# PIXEL GATE (D1): the `render` job below calls .github/workflows/render.yml and every packaging
# job `needs:` it, so a red pixel diff produces no artifacts at all. The render suite is not on
# the PR path — it runs weekly on `main` and here. See render.yml's header.
#
# The workspace lives in `app/`; the toolchain comes from `app/rust-toolchain.toml`.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # D1: nothing ships without a green pixel suite. The render suite (Xvfb + lavapipe) is not on
  # the PR path — it runs weekly on `main` and here, at release. The packaging jobs `needs:` this,
  # so a red pixel diff means no artifacts are produced at all, rather than artifacts plus a red X
  # somebody is expected to notice. It costs the suite's wall-clock at the front of a release; on
  # an infrequent, deliberate operation that is the right trade. See render.yml's header for the
  # measured flake data behind making this blocking.
  render:
    uses: ./.github/workflows/render.yml

  macos:
    needs: render
    name: package (macOS — app + dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        working-directory: app
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # cargo-packager pinned to the version the config + scripts were authored against.
      # `cargo install` (compile) is used rather than a prebuilt action so the release path
      # has no dependency on a third-party tool index; it is cached implicitly across runs
      # via ~/.cargo. Releases are infrequent (tag pushes), so the compile cost is fine.
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build + package (app/scripts/package.sh)
        run: app/scripts/package.sh

      # Upload only the .dmg: it wraps a faithful, launchable .app. We deliberately do NOT
      # upload the raw *.app bundle — actions/upload-artifact@v4 zips matched paths and drops
      # Unix exec bits + symlinks, so a downloaded raw .app would not launch. Users mount the
      # .dmg to get the working .app.
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: freecell-macos
          path: app/target/packages/*.dmg
          if-no-files-found: error

  linux:
    needs: render
    name: package (Linux ${{ matrix.arch }} — deb + AppImage)
    runs-on: ${{ matrix.runner }}
    # Build x64 AND arm64 as separate NATIVE builds — one runner per architecture — rather
    # than cross-compiling. GitHub-hosted arm64 Linux runners (`ubuntu-24.04-arm`) are free
    # for public repos, so each arch gets a true native binary, and linuxdeploy downloads the
    # arch-matched AppImage tooling on each runner. Each leg uploads under its own artifact
    # name (freecell-linux-<arch>, below), so the two never collide on the run page;
    # cargo-packager additionally stamps the arch into the filenames themselves (…_amd64.deb /
    # …_arm64.deb, …_x86_64.AppImage / …_aarch64.AppImage), so they stay distinct even if both
    # artifacts are later unpacked into one directory. `fail-fast: false` keeps one arch's
    # failure from cancelling the other. Both are REQUIRED (see the header note).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Build deps for the GPUI Linux (blade/Vulkan) build — the same libs as `checks.yml`,
      # minus the render/capture-only tools (no rendering happens while packaging). `file` +
      # `patchelf` are used by linuxdeploy while assembling the .AppImage; desktop-file-utils
      # provides `desktop-file-validate`. `libfuse2t64` is defensive FUSE insurance for
      # AppImage: linuxdeploy is invoked with `--appimage-extract-and-run` (which normally
      # avoids FUSE), but that is version-dependent and this job is REQUIRED, so we install it
      # rather than risk a blocking failure the first time an AppImage is assembled in CI.
      # NOTE: on ubuntu-24.04 (noble) the package is `libfuse2t64` (the t64 transition renamed
      # `libfuse2`); if the runner image changes, adjust this name. See app/PACKAGING.md.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libgbm-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            file patchelf desktop-file-utils libfuse2t64

      - name: Install pinned toolchain
        working-directory: app
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build + package (app/scripts/package.sh)
        run: app/scripts/package.sh

      # One artifact per architecture — upload-artifact@v4 requires unique artifact names,
      # and arch-suffixed names (freecell-linux-x64 / freecell-linux-arm64) make the run page
      # unambiguous about which build is which.
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: freecell-linux-${{ matrix.arch }}
          path: |
            app/target/packages/*.deb
            app/target/packages/*.AppImage
          if-no-files-found: error

  windows:
    needs: render
    name: package (Windows — nsis)
    runs-on: windows-latest
    # Windows is a first-class target: it compiles and packages, so a failure here gates the
    # release exactly like macOS and Linux (no continue-on-error).
    #
    # OPTIONAL Azure Trusted Signing. These map secrets/vars into the env that
    # app/scripts/sign-windows.ps1 reads (via package.ps1) to sign the core exe + installer.
    # When they are unset (forks, or before signing is provisioned) every value is empty,
    # sign-windows.ps1 skips signing, and the job still produces a normal UNSIGNED installer —
    # signing is strictly opt-in and never blocks the build. To enable it, set the three
    # AZURE_*_ID/SECRET plus the account + profile — each can live under repo *Secrets* OR
    # *Variables* (the `secrets.X || vars.X` below reads whichever tab you used).
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT || vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE || vars.AZURE_TRUSTED_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        working-directory: app
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      # Only needed when signing is configured — skipped (empty tenant/account) on forks or
      # before signing is provisioned, so the unsigned build path pays nothing for it.
      - name: Install Azure Trusted Signing CLI
        if: ${{ env.AZURE_TENANT_ID != '' && env.AZURE_TRUSTED_SIGNING_ACCOUNT != '' }}
        run: cargo install trusted-signing-cli --locked --version 0.11.0

      - name: Build + package (app/scripts/package.ps1)
        shell: pwsh
        run: app/scripts/package.ps1

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: freecell-windows
          path: app/target/packages/*.exe
          if-no-files-found: error
