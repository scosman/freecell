# Linux `render` — the pixel gate (architecture.md §9).
#
# Renders the real grid over engine-produced scenes under Xvfb + Mesa lavapipe (software
# Vulkan) and perceptual-diffs each case against a committed baseline. It is SPLIT OUT of the
# fast `checks` job because software rendering is slow (many minutes), and it is deliberately
# NOT on the PR path: most PRs cannot move a pixel, and the suite cannot earn its cost on them.
#
# THREE TRIGGERS, and why (D1 — projects/architecture-review-remediation.md):
#
#   schedule  — WEEKLY ON `main`. This is the backstop. Before D1 this workflow was
#               `workflow_dispatch`-only, and in its whole life it ran 29 times across 13
#               feature branches and ZERO times on `main`, against 44 merged PRs — so `main`
#               had never been render-verified. A weekly run catches whatever slipped through
#               merges, at a cadence where a regression is still cheap to bisect. (A scheduled
#               workflow only ever runs on the default branch, which is exactly what we want.)
#
#   workflow_call — invoked by `release.yml`, which makes its packaging jobs `needs:` this.
#               Nothing ships without a green pixel suite. This is a BLOCKING gate: it adds
#               the suite's wall-clock to the front of a release, which is an accepted cost on
#               an infrequent, deliberate operation. See the flake note below for why blocking
#               is defensible.
#
#   workflow_dispatch — unchanged, for the agent-driven case: an agent making a rendering
#               change runs the relevant subset locally and dispatches the full suite on its
#               branch when it wants confirmation. What D1 changed is that FORGETTING to do so
#               no longer means nobody checked.
#
# NOT A REQUIRED PER-PR STATUS CHECK. The previous header claimed it "MUST be a required
# status check" while the trigger made that impossible to satisfy — a dispatch-only workflow
# reports no context on a PR, so a required check would simply block every merge. Owner
# decision (2026-07-28): keep it off the PR path entirely. Bump-token, `paths` filter and a
# per-PR gate were all considered and rejected as ceremony over a weekly backstop.
#
# FLAKE, measured rather than assumed: of the 29 dispatched runs, 26 succeeded, 1 was
# cancelled, and 2 failed — both on the SAME branch on the SAME day, mid-development on a
# chart-rendering change, i.e. the gate doing its job on genuinely-moved pixels. There is no
# evidence of lavapipe infrastructure flake in 29 runs, which is what makes blocking a release
# on it reasonable. If that changes, back the release gate off before weakening the schedule.
#
# NOTE: GitHub disables scheduled workflows in a repository with no activity for 60 days.
#
# The workspace lives in `app/`; the pinned toolchain comes from `app/rust-toolchain.toml`.

name: render

# Least privilege, stated explicitly now that this workflow is embedded in the RELEASE path via
# `workflow_call`: it only checks out code and uploads a run artifact, neither of which needs
# write scope. Behaviourally identical to the repo default today; the point is that a future
# default change (or a caller with broader permissions) cannot silently widen it.
permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Weekly on `main`, Sunday 07:17 UTC — off-peak, and off the hour (GitHub's scheduler is
    # heavily contended at :00, which delays runs).
    - cron: "17 7 * * 0"

# Concurrency key: CALLER WORKFLOW + EVENT + REF.
#
# The rule that makes this non-obvious: inside a REUSABLE workflow, the `github` context is the
# CALLER's, not this file's. So on the `workflow_call` path `github.event_name` is whatever
# triggered `release.yml` (`push` for a tag, `workflow_dispatch` for a manual release) — never
# the string "workflow_call" — and `github.workflow` is the caller's workflow name (`release`),
# while on the direct paths it is this workflow's own name (`render`). Keying on the workflow
# name is therefore what actually distinguishes "render, called by a release" from "render, run
# directly"; the event alone does not.
#
# What that buys, with `cancel-in-progress: true`:
#
#   schedule on `main`      render-render-schedule-refs/heads/main
#   dispatch on `main`      render-render-workflow_dispatch-refs/heads/main
#   release by tag          render-release-push-refs/tags/vX.Y.Z
#   release by dispatch     render-release-workflow_dispatch-<caller ref>
#
# — four distinct groups, so none of them can cancel another. In particular the weekly backstop
# is no longer eaten by someone dispatching on `main`, and a release's render job no longer
# collides with a direct dispatch on the same ref (which would also have overridden
# `release.yml`'s deliberate `cancel-in-progress: false`).
#
# Two dispatches on the SAME branch still share a group and supersede each other — exactly what
# an iterating agent wants. The one collision that remains by construction: two *manual* release
# dispatches on the same ref share a render group, so the newer cancels the older's render job.
# Releases are infrequent and deliberate, and the caller-level `release-${{ github.ref }}` group
# is what governs the release itself; a second concurrent release of the same ref is already a
# mistake, not a workflow we need to keep alive.
concurrency:
  group: render-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A2: CI must prove it built the COMMITTED lockfile (the one cargo-deny audits), so the
  # wrapper script forwards this to its cargo invocations. Unset locally, where a mid-edit
  # lock must not fail an iteration run.
  CARGO_LOCKED: "--locked"
  # Same CI-only build trims as checks.yml so render's own build stays disk-lean:
  # no incremental artifacts, and line-tables-only debug info (keeps file:line in
  # backtraces but drops the heavy DWARF that dominated target/ + the link step).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Software rendering under lavapipe on a shared runner is "occasionally flaky": the first,
  # coldest render can present a blank frame within the default settle window. Give the capture
  # harness more settle/present margin here (it stays fast locally on the default), and let it
  # retry a transient blank/xvfb failure a few times per case (the harness default is 3) rather
  # than aborting the whole shared render-all on the first case. These only change WHEN a frame
  # is captured (after it has fully painted), never WHAT — so committed baselines are unaffected.
  RENDER_TESTS_SETTLE_S: "6.0"
  RENDER_TESTS_PRESENT_S: "2.0"
  RENDER_TESTS_CAPTURE_ATTEMPTS: "4"

jobs:
  render:
    name: render (Xvfb + lavapipe)
    runs-on: ubuntu-24.04
    steps:
      # ubuntu-24.04 runners have ~14 GB free after their preinstalled toolchains, and this
      # job cold-builds the GPUI/zed-scale tree AND links the debug-heavy render binaries — the
      # step that historically tipped into "No space left on device". Reclaim ~20 GB up front by
      # deleting large preinstalled SDKs this Rust build never touches (Android / .NET / GHC /
      # CodeQL) plus cached docker images. Inlined rather than a third-party action so the exact
      # rm set is auditable and can't change under us (matches this repo's pinning posture); the
      # trade-off is we hand-maintain these paths if a future runner image relocates them. rm of
      # a missing path is a harmless no-op, and swap + the apt/cargo/rust caches are left intact.
      - name: Free runner disk (drop preinstalled SDKs unused by this Rust build)
        run: |
          echo "== disk before =="; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "== disk after =="; df -h /

      - uses: actions/checkout@v4

      # The FULL capture stack via the ONE canonical setup script (also run by devs/agents
      # locally + by checks.yml, so environments cannot drift): X11/Wayland/xkb, Vulkan loader
      # + lavapipe (software Vulkan) ICD, fontconfig + freetype, gbm, ALSA, the capture tools
      # (Xvfb, ImageMagick `import`, xrefresh, xwininfo), plus DejaVu Serif for the explicit-
      # serif render case. The UI font (Inter) is bundled in the app binary (add_fonts), so no
      # system UI font is needed. See the script header and render-tests/README.md.
      - name: Install system dependencies (capture stack + fonts)
        run: app/render-tests/scripts/setup_render_env.sh

      # Installs the toolchain pinned by app/rust-toolchain.toml. `rustup toolchain install`
      # (no arg) reads the override file; `rustup show` no longer installs on rustup >= 1.28.
      - name: Install pinned toolchain
        working-directory: app
        run: rustup toolchain install

      # `cache-on-failure: true`: a red render run must still SAVE the freshly-compiled
      # gpui/zed/ironcalc tree, or every manual run starts cold. Shares the `app` cache with
      # checks.yml (same key inputs), so a green checks run on this branch/main warms this job.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          cache-on-failure: true

      # Phase 7 REQUIRED render-test suite. Renders the real grid over engine-produced scenes
      # and perceptual-diffs each against a committed baseline. The harness sizes an Xvfb display
      # per case (a small window on a large screen won't present under lavapipe), so this is NOT
      # wrapped in a single xvfb-run; the script sets FREECELL_RENDER=1 to turn the pixel suite
      # on (without it the pixel cases self-skip). It also hard-fails if the capture tooling is
      # missing, refusing to run a zero-pixel gate.
      - name: Render-test suite (Xvfb + lavapipe)
        working-directory: app
        run: render-tests/scripts/render_tests.sh test

      - name: Upload render failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-failures
          path: app/target/render-failures/
          if-no-files-found: ignore
