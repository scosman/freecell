[workspace]
resolver = "2"
members = [
    "crates/freecell-core",
    "crates/freecell-chart-model",
    "crates/freecell-engine",
    "crates/freecell-app",
    "render-tests",
]
# `vendor/*` holds the permissively-licensed no-op stubs that replace zed's GPL-3.0 tracing
# shims via `[patch]` below. They are build-time substitutes, not app crates, so they are
# excluded from the workspace (own license/edition, not workspace-linted). See vendor/README.md.
exclude = [
    "vendor/ztracing",
    "vendor/ztracing_macro",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# MSRV must match the pinned toolchain: gpui needs `std::hint::cold_path()`, stabilized
# in 1.95.0 (see rust-toolchain.toml + DECISIONS_TO_REVIEW.md). 1.94 cannot build it.
rust-version = "1.95"
publish = false

# ---------------------------------------------------------------------------------
# Shared dependency pins (architecture.md §1 "Pinned dependencies").
#
# The gpui/zed rev and the gpui-component SHA are a KNOWN-GOOD PAIR: gpui-component's
# workspace at the pinned SHA pins this exact zed rev. Bump both together, never one
# alone (architecture.md §10 risk "gpui-component SHA compatibility").
# ---------------------------------------------------------------------------------
[workspace.dependencies]
# Internal crates
freecell-core = { path = "crates/freecell-core" }
# `freecell-chart-model` (charts project, P1): the gpui-free / ironcalc-free chart data model —
# the stable seam the engine parses into and the app renders from.
freecell-chart-model = { path = "crates/freecell-chart-model" }
freecell-engine = { path = "crates/freecell-engine" }
# `freecell-app` exposes a `[lib]` (`freecell_app`, Phase 6): `render-tests` (Phase 7) and
# the perf harness (Phase 12) depend on it to render the real grid over fixtures.
freecell-app = { path = "crates/freecell-app" }

# Engine. These are NOT the version that ships: `[patch.crates-io]` at the bottom of this file
# redirects both crates to our fork, so nothing is ever resolved from crates.io under this
# requirement. The `=0.7.1` requirement is what the patch ATTACHES to — cargo only applies a
# `[patch]` entry whose replacement version satisfies the requirement it replaces, so the pin has
# to stay and has to keep matching the fork's declared version. Read it as "the fork's base
# version", not as "we ship IronCalc 0.7.1"; the code that actually builds is the `rev` below.
ironcalc = "=0.7.1"
ironcalc_base = "=0.7.1"

# GPUI (pinned zed rev). gpui_platform features mirror gpui-component's own workspace
# (font-kit + the Linux backends x11/wayland + runtime_shaders) so the cross-platform
# build matches the known-good gpui-component configuration.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }

# gpui-component pinned to a main SHA that pins the zed rev above (resolved at
# scaffolding time — see DECISIONS_TO_REVIEW.md, Phase 1).
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "a9a7341c35b62f27ff512371c62419342264710c" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "a9a7341c35b62f27ff512371c62419342264710c" }

# Utility
thiserror = "2"
anyhow = "1"
tempfile = "3"
# OOXML chart file layer (charts project, `freecell-engine::chart`): the same `zip` + `roxmltree`
# second-pass an `.xlsx` (an OPC zip of XML parts) needs to walk the worksheet→drawing→chart
# chain on load and re-inject chart parts on save. Both are already resolved in `Cargo.lock`.
zip = "0.6"
roxmltree = "0.19"
# Worker seam (Phase 4, components/engine_worker.md §Threading & channels):
# `arc-swap` = the lock-free `Publication` snapshot slot (publish-then-bump);
# `async-channel` = the worker→UI `WorkerEvent` channel (the type `smol::channel`
# re-exports — awaited by the gpui foreground task, blocking-recv in headless tests —
# without pulling an async runtime into the headless engine); `parking_lot` = the shared
# `RwLock<SheetCaches>` (no poisoning if the worker panics under a write lock).
arc-swap = "1"
async-channel = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `csv` (the same crate ironcalc_base's `paste_csv_string` uses) computes TSV paste dims in
# `freecell-core::tsv` with the engine's exact reader config, so the overflow-guard bound is
# quote-/terminator-aware and can never diverge from the engine's own parse.
csv = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
# Kept intentionally light; CI runs `clippy --workspace -- -D warnings` as the real gate.
# `rust_2018_idioms` is deliberately NOT enabled: its `elided_lifetimes_in_paths` fights
# gpui's pervasive idiomatic `Context<Self>` / `&mut App` signatures across the app crate.
todo = "warn"

# gpui is slow when built unoptimised (per gpui-component's own workspace); build it
# and its platform layer with optimisation even in dev so frame times stay usable.
[profile.dev.package.gpui]
opt-level = 3

[profile.dev.package.gpui_platform]
opt-level = 3

# ---------------------------------------------------------------------------------
# IronCalc: build against our fork `scosman/ironcalc`, pinned BY SHA to a commit on its
# `freecell-fixes` integration branch.
#
# THE FORK IS PERMANENT. We keep it, keep upstreaming fixes as clean single-fix PRs, and keep
# re-syncing from upstream `main` (CLAUDE.md §Engine, projects/ironcalc-upgrade.md). It is not a
# temporary state with an exit: `freecell-fixes` carries a whole FEATURE upstream does not have
# (merged cells) alongside the `UserModel::set_user_inputs` batched-write API the paste /
# Replace-All path rides on.
#
# WHAT IS ON THE BRANCH: 11 changes at this pin — 6 already merged upstream, 5 fork-only. The
# per-fix table (with the patch-id method to re-derive it, because a hand-maintained list goes
# stale) lives in specs/projects/ironcalc-upstreaming/implementation_plan.md §Status table. Don't
# duplicate it here; this comment has been wrong about the branch's contents before.
#
# WHY A `rev`, NOT A `branch`: `freecell-fixes` is maintained by REBASING onto upstream `main`
# (CLAUDE.md §Engine), and it is rewritten and reverted in place. A `branch =` pin means the
# commit a given FreeCell revision builds against is decided by whatever the branch points at
# when the lock is next regenerated — so an old FreeCell commit is not reproducible, and one
# force-push + GC makes it unbuildable. Every other git dependency here (the four zed/
# gpui-component pins) is `rev`-pinned; this is now consistent with them.
#
# BUMPING THE FORK is a deliberate one-line edit of both revs below, followed by
# `cargo update -p ironcalc -p ironcalc_base`. It is a real change to what ships and belongs in
# its own commit — never a drive-by. Confirm the workspace tests still pass: the fork's branch
# tip has diverged from this pin before (see specs/projects/v05-cleanup-1/phase_plans/phase_1.md
# — the tip at the time of pinning reverted `fix/dollar-negative-zero`, which
# `freecell-engine::document`'s scalar-function tests assert).
# ---------------------------------------------------------------------------------
[patch.crates-io]
ironcalc = { git = "https://github.com/scosman/ironcalc", rev = "cee2859dceda65ff64e52192be4ec47a259870e1" }
ironcalc_base = { git = "https://github.com/scosman/ironcalc", rev = "cee2859dceda65ff64e52192be4ec47a259870e1" }

# ---------------------------------------------------------------------------------
# GPL ship blocker (zed#55470). gpui pulls `sum_tree` -> `ztracing` -> `zlog` +
# `ztracing_macro`, all GPL-3.0-or-later. FreeCell never sets `ZTRACING`, so these compile to
# no-op shims and `sum_tree` uses only the pass-through `#[instrument]` — the GPL code is
# unused. Substitute our own permissively-licensed no-op stubs so the GPL crates are neither
# compiled nor linked (replaces the former license exception in deny.toml). The `ztracing`
# stub drops the `zlog` dependency, so `zlog` (whose only dependent was `ztracing`) leaves the
# graph too. See vendor/README.md + projects/pre-distribution-security-audit.md.
# ---------------------------------------------------------------------------------
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "vendor/ztracing" }
ztracing_macro = { path = "vendor/ztracing_macro" }
