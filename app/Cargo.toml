[workspace]
resolver = "2"
members = [
    "crates/freecell-core",
    "crates/freecell-chart-model",
    "crates/freecell-engine",
    "crates/freecell-app",
    "render-tests",
]
# `vendor/*` holds the permissively-licensed no-op stubs that replace zed's GPL-3.0 tracing
# shims via `[patch]` below. They are build-time substitutes, not app crates, so they are
# excluded from the workspace (own license/edition, not workspace-linted). See vendor/README.md.
exclude = [
    "vendor/ztracing",
    "vendor/ztracing_macro",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# MSRV must match the pinned toolchain: gpui needs `std::hint::cold_path()`, stabilized
# in 1.95.0 (see rust-toolchain.toml + DECISIONS_TO_REVIEW.md). 1.94 cannot build it.
rust-version = "1.95"
publish = false

# ---------------------------------------------------------------------------------
# Shared dependency pins (architecture.md §1 "Pinned dependencies").
#
# The gpui/zed rev and the gpui-component SHA are a KNOWN-GOOD PAIR: gpui-component's
# workspace at the pinned SHA pins this exact zed rev. Bump both together, never one
# alone (architecture.md §10 risk "gpui-component SHA compatibility").
# ---------------------------------------------------------------------------------
[workspace.dependencies]
# Internal crates
freecell-core = { path = "crates/freecell-core" }
# `freecell-chart-model` (charts project, P1): the gpui-free / ironcalc-free chart data model —
# the stable seam the engine parses into and the app renders from.
freecell-chart-model = { path = "crates/freecell-chart-model" }
freecell-engine = { path = "crates/freecell-engine" }
# `freecell-app` exposes a `[lib]` (`freecell_app`, Phase 6): `render-tests` (Phase 7) and
# the perf harness (Phase 12) depend on it to render the real grid over fixtures.
freecell-app = { path = "crates/freecell-app" }

# Engine. These are NOT the version that ships: `[patch.crates-io]` at the bottom of this file
# redirects both crates to our fork, so nothing is ever resolved from crates.io under this
# requirement. What must exist is SOME requirement the patch can satisfy — cargo only applies a
# `[patch]` entry whose replacement version satisfies the requirement it replaces. The `=` is not
# the load-bearing part (a plain `0.7` would work just as well); what is load-bearing is that the
# requirement keeps matching the version the fork's own manifest declares. Read it as "the fork's
# base version", not as "we ship IronCalc 0.7.1"; the code that builds is the `rev` below.
#
# THE FAILURE MODE IS A WARNING, NOT AN ERROR — which is why this is worth spelling out. If the
# fork's declared version ever stops satisfying this requirement, cargo does not fail: it prints
# `patch for 'ironcalc' ... was not used in the crate graph`, silently resolves the REAL crates.io
# `ironcalc` instead, and the build only dies much later at compile time on a missing fork API
# (e.g. merged cells). This is live, not hypothetical: the fork's crates declare `0.7.1` at the
# pinned rev, while upstream `ironcalc/IronCalc` has already released `0.8.x`. The next re-sync of
# the fork's `main` onto upstream will bump its declared version — expect to move these two lines
# in the same commit as that re-sync, and treat a "patch was not used" warning as a hard error.
ironcalc = "=0.7.1"
ironcalc_base = "=0.7.1"

# GPUI (pinned zed rev). gpui_platform features mirror gpui-component's own workspace
# (font-kit + the Linux backends x11/wayland + runtime_shaders) so the cross-platform
# build matches the known-good gpui-component configuration.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }

# gpui-component pinned to a main SHA that pins the zed rev above (resolved at
# scaffolding time — see DECISIONS_TO_REVIEW.md, Phase 1).
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "a9a7341c35b62f27ff512371c62419342264710c" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "a9a7341c35b62f27ff512371c62419342264710c" }

# Utility
thiserror = "2"
anyhow = "1"
tempfile = "3"
# OOXML chart file layer (charts project, `freecell-engine::chart`): the same `zip` + `roxmltree`
# second-pass an `.xlsx` (an OPC zip of XML parts) needs to walk the worksheet→drawing→chart
# chain on load and re-inject chart parts on save. Both are already resolved in `Cargo.lock`.
zip = "0.6"
roxmltree = "0.19"
# Worker seam (Phase 4, components/engine_worker.md §Threading & channels):
# `arc-swap` = the lock-free `Publication` snapshot slot (publish-then-bump);
# `async-channel` = the worker→UI `WorkerEvent` channel (the type `smol::channel`
# re-exports — awaited by the gpui foreground task, blocking-recv in headless tests —
# without pulling an async runtime into the headless engine); `parking_lot` = the shared
# `RwLock<SheetCaches>` (no poisoning if the worker panics under a write lock).
arc-swap = "1"
async-channel = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `csv` (the same crate ironcalc_base's `paste_csv_string` uses) computes TSV paste dims in
# `freecell-core::tsv` with the engine's exact reader config, so the overflow-guard bound is
# quote-/terminator-aware and can never diverge from the engine's own parse.
csv = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
# Kept intentionally light; CI runs `clippy --workspace -- -D warnings` as the real gate.
# `rust_2018_idioms` is deliberately NOT enabled: its `elided_lifetimes_in_paths` fights
# gpui's pervasive idiomatic `Context<Self>` / `&mut App` signatures across the app crate.
todo = "warn"

# gpui is slow when built unoptimised (per gpui-component's own workspace); build it
# and its platform layer with optimisation even in dev so frame times stay usable.
[profile.dev.package.gpui]
opt-level = 3

[profile.dev.package.gpui_platform]
opt-level = 3

# ---------------------------------------------------------------------------------
# IronCalc: build against our fork `scosman/ironcalc`, pinned BY SHA to a commit on its
# `freecell-fixes` integration branch.
#
# THE FORK IS PERMANENT. We keep it, keep upstreaming fixes as clean single-fix PRs, and keep
# re-syncing from upstream `main` (CLAUDE.md §Engine, projects/ironcalc-upgrade.md). It is not a
# temporary state with an exit: `freecell-fixes` carries a whole FEATURE upstream does not have
# (merged cells) alongside the `UserModel::set_user_inputs` batched-write API the paste /
# Replace-All path rides on.
#
# WHAT WE HAVE AUTHORED: 11 changes as of 2026-08-07 — 8 already merged upstream, 3 fork-only.
# The counted set is "every change WE authored that this pin carries, or that upstream merged and
# the fork re-inherited via its `main` mirror" — not "the merges visible on the branch", which
# under-counts (a merged fix stops being a fork-only merge once `main` is re-synced). The per-fix
# table (with the method to re-derive it, because a hand-maintained list goes stale) lives in
# specs/projects/ironcalc-upstreaming/implementation_plan.md §Status table. Don't duplicate it
# here; this comment has been wrong about the branch's contents before.
#
# WHY A `rev`, NOT A `branch`: `freecell-fixes` is maintained by REBASING onto upstream `main`
# (CLAUDE.md §Engine), and it is rewritten and reverted in place. Under `branch =` the lock does
# record an exact commit — but ANY regeneration of the lock silently moves the build to whatever
# the branch points at then, with NOTHING in the manifest recording that the engine changed. That
# is not theoretical: it is exactly how this pin's own move onto `ecbf6226` (below) would have
# arrived — as a mysteriously-red DOLLAR assertion after a stray `cargo update`, instead of as a
# deliberate one-line edit. Every other git dependency here (the four zed/gpui-component pins) is
# `rev`-pinned; this is now consistent with them.
#
# BUMPING THE FORK is a deliberate one-line edit of both revs below, followed by
# `cargo update -p ironcalc -p ironcalc_base`. It is a real change to what ships and belongs in
# its own commit — never a drive-by, and never left to a stray `cargo update`. ALWAYS run the
# workspace tests after: a bump can change engine behaviour the suite asserts. Worked example —
# this pin's own move onto `ecbf6226` picked up the deliberate revert of
# `fix/dollar-negative-zero` (fork PR #2), turning `=DOLLAR(-0.001,2)` in
# `freecell-engine::document` red. The right resolution was to CORRECT the expectation to
# `($0.00)`, not to drop it: Excel picks DOLLAR's parenthesized form from the sign of the input
# BEFORE rounding, so a negative that rounds to zero still parenthesizes (upstream
# ironcalc/IronCalc#1293, closed unmerged — Google Sheets is what returns `$0.00`). A bump that
# reddens a test is telling you what changed; answer it, don't silence it.
#
# CURRENT PIN `c1acacb` (bumped 2026-08-07, from `ecbf6226`). It is a strict DESCENDANT of the
# previous pin — exactly four commits, nothing reverted: an XMATCH array-constant xlsx test and
# its merge, plus `fix/paste-fill-relative-refs` (Excel-style paste fill with per-cell relative
# references) and its merge. The paste-fill fix is why the pin had to move at all: `main` had
# already absorbed it, so staying on `ecbf6226` would have reverted it on this branch.
#
# DO NOT MOVE THIS PIN TO THE BRANCH TIP without treating it as its own project. Past `c1acacb`
# the fork merged upstream `main` and `9bed9ec` bumped its declared version to 0.8.3, which does
# NOT satisfy the `ironcalc = "=0.7.1"` requirement above. Cargo does not error on that: it
# silently declines to apply a `[patch]` whose replacement version fails the requirement, emits
# only a "patch ... was not used in the crate graph" warning, resolves the REAL crates.io
# `ironcalc 0.7.1`, and then fails at compile on the missing merged-cells API with a message that
# points nowhere near the cause. Moving to the tip therefore means a coordinated `=0.8.3`
# requirement bump plus an engine minor upgrade carrying an upstream merge — see
# projects/ironcalc-upgrade.md. After ANY bump, confirm the patch actually applied rather than
# assuming it: `cargo metadata --locked` must show both crates resolving to the fork `rev`, and
# the build must emit no "patch ... was not used" warning.
# ---------------------------------------------------------------------------------
[patch.crates-io]
ironcalc = { git = "https://github.com/scosman/ironcalc", rev = "c1acacbda22e98450ab36139e686ecc29ff19305" }
ironcalc_base = { git = "https://github.com/scosman/ironcalc", rev = "c1acacbda22e98450ab36139e686ecc29ff19305" }

# ---------------------------------------------------------------------------------
# GPL ship blocker (zed#55470). gpui pulls `sum_tree` -> `ztracing` -> `zlog` +
# `ztracing_macro`, all GPL-3.0-or-later. FreeCell never sets `ZTRACING`, so these compile to
# no-op shims and `sum_tree` uses only the pass-through `#[instrument]` — the GPL code is
# unused. Substitute our own permissively-licensed no-op stubs so the GPL crates are neither
# compiled nor linked (replaces the former license exception in deny.toml). The `ztracing`
# stub drops the `zlog` dependency, so `zlog` (whose only dependent was `ztracing`) leaves the
# graph too. See vendor/README.md + projects/pre-distribution-security-audit.md.
# ---------------------------------------------------------------------------------
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "vendor/ztracing" }
ztracing_macro = { path = "vendor/ztracing_macro" }
